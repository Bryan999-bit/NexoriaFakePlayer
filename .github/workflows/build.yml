name: Build NexoriaFakePlayer

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Source ZIP tidak ditemukan!"
            exit 1
          fi
          unzip -o "$ZIP" -d .
          test -f build.gradle || exit 1

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build plugin
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.14'
          arguments: clean build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: NexoriaFakePlayer
          path: build/libs/*.jar
          
